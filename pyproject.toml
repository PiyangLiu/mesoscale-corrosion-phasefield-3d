[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesoscale-corrosion-phasefield-3d"
version = "1.2.0"
description = "Reference 3D mesoscale model for chloride-induced corrosion cracking in reinforced concrete"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Piyang Liu"},
  {name = "Junchen Xin"},
  {name = "Jianyu Song"},
  {name = "Dongshuai Hou"},
  {name = "Zhiming Pang"},
  {name = "Jiuwen Bao"},
  {name = "Pan Wang"}
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pyamg>=5.1,<6",
  "matplotlib>=3.8,<4",
  "pandas>=2.1,<4",
  "pillow>=10,<13"
]

[project.scripts]
corrosion3d-run = "corrosion3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
